# workhub config. Lives at ~/.config/workhub/config.toml (or $WORKHUB_CONFIG).

[gitlab]
# Read through `glab api`, so glab must be logged in to this host (`glab auth status`).
host = "gitlab.example.com"
# Groups (subgroups included) to collect your issues, MRs and review requests from.
groups = ["my-group/my-subgroup"]

[jira]
site = "https://your-site.atlassian.net"
email = "you@example.com"
# `workhub jira-token` saves your API token here with mode 600. JIRA_API_TOKEN overrides the file.
token_file = "~/.config/workhub/jira-token"
# Tickets shown on the board. A ticket that stops matching (Closed, reassigned) leaves the board.
# Resolved tickets show for every issue type except Sub-task.
jql = '''
(assignee = currentUser() OR "Dev Engineer" = currentUser() OR "Business Analyst" = currentUser())
AND (status in ("Open", "Issue Clarification", "Preparation", "Development", "Validate")
     OR (status = "Resolved" AND issuetype != "Sub-task"))
'''
# User fields that put a role badge on the card when they name you.
role_fields = ["Dev Engineer", "Business Analyst"]
# Leave empty: workhub finds out whether your token needs the api.atlassian.com gateway (scoped tokens do).
api_base = ""

[board]
port = 8765
# "none": `workhub board` only starts the server, for a tab you keep pinned (Zen: http://localhost:8765/).
# "app" opens its own Edge/Chrome window; "browser" opens a new tab in your default browser.
window = "none"
# How often the running board pulls from Jira and GitLab, in minutes.
sync_minutes = 10
