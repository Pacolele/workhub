[project]
name = "workhub"
version = "0.1.0"
description = "One board for your Jira tickets and GitLab issues/MRs: plan the day, keep a priority list, see what's next"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
workhub = "workhub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workhub"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
